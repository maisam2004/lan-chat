<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Surfaces */
      --surface: #f8f9ff;
      --surface-lowest: #ffffff;
      --surface-low: #eff4ff;
      --surface-container: #e5eeff;
      --surface-container-high: #dce9ff;
      --surface-highest: #d3e4fe;
      /* Text */
      --on-surface: #0b1c30;
      --on-surface-variant: #424754;
      --outline: #727785;
      --outline-variant: #c2c6d6;
      /* Brand */
      --primary: #0058be;
      --primary-hover: #004395;
      --on-primary: #ffffff;
      --primary-container: #d8e2ff;
      /* Semantic */
      --success: #006c49;
      --success-container: #6cf8bb;
      --error: #ba1a1a;
      --error-container: #ffdad6;
      /* Radii */
      --r-sm: 0.25rem;
      --r-md: 0.5rem;
      --r-lg: 0.75rem;
      --r-xl: 1rem;
      --r-full: 9999px;
      /* Spacing */
      --s-xs: 0.25rem;
      --s-sm: 0.5rem;
      --s-md: 1rem;
      --s-lg: 1.5rem;
      --s-xl: 2rem;
      /* Fonts */
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-body: 'Geist', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--on-surface);
      background: var(--surface);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }

    /* Layout */
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--s-md);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      .app { padding: var(--s-lg) var(--s-xl); }
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--s-md);
      padding-bottom: var(--s-md);
      border-bottom: 1px solid var(--outline-variant);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--s-sm);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--on-surface);
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--r-md);
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-display);
    }
    .brand-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--success);
      background: #e6fbf2;
      padding: 4px 10px;
      border-radius: var(--r-full);
      letter-spacing: 0.02em;
    }
    .brand-live::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(0, 108, 73, 0.15);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: var(--s-xs);
      margin-bottom: var(--s-md);
      padding: 4px;
      background: var(--surface-container);
      border-radius: var(--r-md);
      width: fit-content;
    }
    .tab {
      padding: 8px 18px;
      background: transparent;
      border: none;
      border-radius: var(--r-sm);
      color: var(--on-surface-variant);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover {
      color: var(--on-surface);
    }
    .tab.active {
      background: var(--surface-lowest);
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* User list */
    #userlist {
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-lg);
      padding: var(--s-sm);
      margin-bottom: var(--s-md);
    }
    .userlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--s-sm) var(--s-md);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--on-surface-variant);
    }
    .userlist-count {
      background: var(--surface-container);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: var(--r-full);
      font-size: 0.7rem;
      font-weight: 600;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px var(--s-md);
      border-radius: var(--r-md);
      transition: background 0.15s;
    }
    .user-item:hover {
      background: var(--surface-low);
    }
    .user-item + .user-item {
      border-top: 1px solid var(--surface-container);
    }
    .user-name {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--on-surface);
    }
    .call-btn {
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .call-btn:hover {
      background: var(--surface-low);
      border-color: var(--primary);
    }

    /* Messages */
    #messages {
      height: 380px;
      overflow-y: auto;
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-lg);
      padding: var(--s-md);
      margin-bottom: var(--s-md);
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--outline-variant);
      border-radius: var(--r-full);
    }

    .message {
      margin: var(--s-sm) 0;
      padding: 10px 14px;
      border-radius: var(--r-lg);
      max-width: 78%;
      word-wrap: break-word;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .message .time {
      color: var(--outline);
      font-size: 0.7rem;
      margin-left: var(--s-sm);
      font-variant-numeric: tabular-nums;
    }
    .message.incoming {
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      color: var(--on-surface);
      margin-right: auto;
    }
    .message.incoming strong { color: var(--on-surface); }
    .message.outgoing {
      background: var(--surface-low);
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      margin-left: auto;
    }
    .message.outgoing strong { color: #1e3a8a; }

    .system {
      color: var(--outline);
      font-style: italic;
      font-size: 0.8rem;
      text-align: center;
      margin: var(--s-md) 0;
      padding: 6px 0;
    }

    /* File messages */
    .file-message {
      margin: var(--s-sm) 0;
      padding: 12px 14px;
      border-radius: var(--r-lg);
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      max-width: 90%;
      font-size: 0.9rem;
      margin-right: auto;
    }
    .file-message.outgoing {
      background: var(--surface-low);
      border-color: #bfdbfe;
      margin-left: auto;
      margin-right: 0;
    }
    .file-message strong { color: var(--on-surface); }
    .file-message.outgoing strong { color: #1e3a8a; }
    .file-message img {
      max-width: 100%;
      border-radius: var(--r-md);
      margin-top: var(--s-sm);
      display: block;
    }
    .file-message .dl-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      margin-top: 6px;
      padding: 4px 10px;
      border: 1px solid #bfdbfe;
      border-radius: var(--r-md);
      background: var(--surface-lowest);
      transition: background 0.15s;
    }
    .file-message .dl-link:hover {
      background: var(--surface-low);
    }
    .file-message .private-badge {
      display: inline-block;
      color: var(--error);
      background: var(--error-container);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--r-full);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: middle;
      margin-right: 4px;
    }
    .file-message .del-file-btn {
      background: transparent;
      border: none;
      color: var(--outline);
      padding: 2px 6px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 6px;
      border-radius: var(--r-sm);
      transition: color 0.15s, background 0.15s;
    }
    .file-message .del-file-btn:hover {
      color: var(--error);
      background: var(--error-container);
    }

    /* Composer */
    .composer {
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-lg);
      padding: var(--s-sm);
    }
    #inputArea, #fileArea {
      display: flex;
      gap: var(--s-sm);
      align-items: center;
    }
    #inputArea { margin-bottom: 6px; }
    #messageInput, #fileInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--on-surface);
      background: transparent;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    #messageInput {
      background: var(--surface-low);
    }
    #messageInput:focus {
      border-color: var(--primary);
      background: var(--surface-lowest);
      box-shadow: 0 0 0 3px rgba(0, 88, 190, 0.12);
    }
    #messageInput::placeholder { color: var(--outline); }

    #fileInput {
      font-size: 0.8rem;
      color: var(--on-surface-variant);
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      padding: 8px 12px;
      width: 30%;
    }
    #fileInput::file-selector-button {
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      color: var(--on-surface);
      padding: 4px 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      margin-right: var(--s-sm);
    }

    #targetSelect {
      padding: 8px 12px;
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-md);
      background: var(--surface-lowest);
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--on-surface);
      cursor: pointer;
      max-width: 140px;
    }
    #targetSelect:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 88, 190, 0.12);
    }

    /* Buttons */
    button {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 9px 16px;
      border: none;
      border-radius: var(--r-md);
      background: var(--primary);
      color: var(--on-primary);
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--primary-hover); }
    button:active { transform: translateY(1px); }
    button:disabled {
      background: var(--surface-container);
      color: var(--outline);
      cursor: not-allowed;
    }
    #sendButton, #uploadButton {
      padding: 9px 18px;
    }

    /* Call status */
    #callStatus {
      margin: var(--s-md) 0;
      padding: var(--s-md);
      background: var(--surface-low);
      border: 1px solid #bfdbfe;
      border-radius: var(--r-lg);
      display: none;
    }
    #callStatusText {
      font-weight: 600;
      color: var(--primary);
      font-size: 0.9rem;
    }
    #callControls {
      display: flex;
      gap: var(--s-sm);
      margin-top: var(--s-sm);
    }
    #muteBtn {
      background: #fef3c7;
      color: #78350f;
    }
    #muteBtn:hover { background: #fde68a; }
    #hangupBtn {
      background: var(--error-container);
      color: var(--error);
    }
    #hangupBtn:hover { background: #fecaca; }

    /* Incoming call dialog */
    #incomingCall {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--surface-lowest);
      padding: var(--s-lg);
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-xl);
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      display: none;
      z-index: 1000;
      min-width: 280px;
      text-align: center;
    }
    #incomingCall p {
      font-size: 0.95rem;
      margin: 0 0 var(--s-md) 0;
      color: var(--on-surface);
    }
    #incomingCall strong { font-family: var(--font-display); }
    #acceptCallBtn, #rejectCallBtn {
      margin: 0 4px;
    }

    /* Login */
    #loginOverlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 28, 48, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: var(--s-md);
    }
    #loginBox {
      background: var(--surface-lowest);
      padding: var(--s-xl);
      border-radius: var(--r-xl);
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      text-align: center;
    }
    #loginBox h2 {
      font-family: var(--font-display);
      margin: 0 0 var(--s-md) 0;
      font-size: 1.25rem;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }
    #passwordInput, #nameInput {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-md);
      margin-bottom: var(--s-sm);
      font-size: 0.95rem;
      font-family: var(--font-body);
      color: var(--on-surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--surface-lowest);
    }
    #passwordInput:focus, #nameInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 88, 190, 0.12);
    }
    #loginButton {
      width: 100%;
      padding: 11px;
      font-size: 0.9rem;
    }
    #loginError {
      color: var(--error);
      font-size: 0.8rem;
      margin: var(--s-sm) 0 0 0;
      min-height: 1em;
    }

    /* Board */
    #featuredArea { margin-bottom: var(--s-md); }
    #featuredArea .featured-card {
      position: relative;
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--on-surface);
      border: 1px solid var(--outline-variant);
    }
    #featuredArea img {
      width: 100%;
      max-height: 45vh;
      object-fit: contain;
      background: var(--on-surface);
      display: block;
    }
    #featuredArea .featured-label {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(11, 28, 48, 0.75);
      color: white;
      padding: 5px 12px;
      border-radius: var(--r-full);
      font-size: 0.7rem;
      font-weight: 500;
      font-family: var(--font-body);
      letter-spacing: 0.02em;
    }
    .board-controls {
      display: flex;
      gap: var(--s-sm);
      margin-bottom: var(--s-md);
      align-items: center;
      padding: var(--s-sm);
      background: var(--surface-lowest);
      border: 1px solid var(--outline-variant);
      border-radius: var(--r-lg);
    }
    .board-controls input[type="file"] {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--on-surface-variant);
      outline: none;
    }
    .board-controls input[type="file"]::file-selector-button {
      background: var(--surface-low);
      border: 1px solid var(--outline-variant);
      color: var(--on-surface);
      padding: 5px 12px;
      border-radius: var(--r-sm);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      margin-right: var(--s-sm);
    }
    #imageGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: var(--s-sm);
    }
    .thumb {
      position: relative;
      padding-bottom: 100%;
      overflow: hidden;
      border-radius: var(--r-lg);
      cursor: pointer;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .thumb:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.12);
    }
    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb .uploader-tag {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(11, 28, 48, 0.8), transparent);
      color: white;
      font-size: 0.7rem;
      padding: 16px 8px 6px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .thumb.featured::after {
      content: '★';
      position: absolute;
      top: 6px; right: 8px;
      color: #ffd700;
      font-size: 1.2em;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(11, 28, 48, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      padding: var(--s-md);
    }
    #lightbox .lb-inner {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--s-md);
      align-items: center;
    }
    #lightbox img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: var(--r-md);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    #lightbox .lb-info {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.85rem;
      text-align: center;
      font-family: var(--font-body);
    }
    #lightbox .lb-actions {
      display: flex;
      gap: var(--s-sm);
      flex-wrap: wrap;
      justify-content: center;
    }
    #lightbox .lb-close {
      background: var(--error);
      color: white;
    }
    #lightbox .lb-close:hover { background: #991b1b; }
    #lightbox .lb-feature {
      background: #fbbf24;
      color: #78350f;
    }
    #lightbox .lb-feature:hover { background: #f59e0b; }
    #lbDownloadBtn {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: var(--r-md);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    #lbDownloadBtn:hover { background: var(--primary-hover); }
    #lbDeleteBtn { background: var(--error); color: white; }
    #lbDeleteBtn:hover { background: #991b1b; }

    #emptyBoard {
      text-align: center;
      color: var(--outline);
      padding: var(--s-xl);
      font-style: italic;
      font-size: 0.9rem;
      border: 1px dashed var(--outline-variant);
      border-radius: var(--r-lg);
      background: var(--surface-lowest);
    }
  </style>
</head>
<body>
  <!-- Login overlay -->
  <div id="loginOverlay">
    <div id="loginBox">
      <h2>Join LAN Hub</h2>
      <input type="text" id="nameInput" placeholder="Your name (e.g., Arya's Laptop)" autocomplete="off" maxlength="32" />
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" />
      <button id="loginButton">Join</button>
      <p id="loginError"></p>
    </div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">L</div>
        <span>LAN Hub</span>
      </div>
      <div class="brand-live">LAN</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="board">Board</button>
    </div>

    <!-- Chat panel -->
    <div id="chatPanel" class="panel active">
      <div id="userlist"></div>
      <div id="messages"></div>

      <div class="composer">
        <div id="inputArea">
          <input type="text" id="messageInput" placeholder="Type a message..." />
          <button id="sendButton">Send</button>
        </div>
        <div id="fileArea">
          <select id="targetSelect" title="Send to...">
            <option value="">Everyone</option>
          </select>
          <input type="file" id="fileInput" />
          <button id="uploadButton">Upload</button>
        </div>
      </div>
    </div>

    <!-- Board panel -->
    <div id="boardPanel" class="panel">
      <div id="featuredArea"></div>
      <div class="board-controls">
        <input type="file" id="boardFileInput" accept="image/*" />
        <button id="boardUploadBtn">Add to Board</button>
      </div>
      <div id="emptyBoard">No images yet. Be the first to add one.</div>
      <div id="imageGrid"></div>
    </div>
  </div>

  <!-- Call status -->
  <div id="callStatus">
    <span id="callStatusText">In call</span>
    <div id="callControls">
      <button id="muteBtn">Mute</button>
      <button id="hangupBtn">Hang Up</button>
    </div>
  </div>

  <!-- Incoming call dialog -->
  <div id="incomingCall">
    <p><strong id="incomingCallUser"></strong> is calling you...</p>
    <button id="acceptCallBtn" style="background:#006c49;">Accept</button>
    <button id="rejectCallBtn" style="background:#ba1a1a;">Reject</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox">
    <div class="lb-inner">
      <img id="lbImg" src="" alt="" />
      <div class="lb-info" id="lbInfo"></div>
      <div class="lb-actions">
        <button class="lb-feature" id="lbFeatureBtn">Set as Featured</button>
        <a class="lb-feature" id="lbDownloadBtn" download>Download</a>
        <button class="lb-delete" id="lbDeleteBtn">Delete</button>
        <button class="lb-close" id="lbCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
        let ws;
    let myId = null;
    let myUsername = null;
    let authPassword = sessionStorage.getItem('lanChatPassword');
    let reconnectTimer = null;

    // -------- Stable device identity --------
    function getOrCreateDeviceId() {
      let id = localStorage.getItem('lanDeviceId');
      if (!id) {
        id = 'dev-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        localStorage.setItem('lanDeviceId', id);
      }
      return id;
    }
    const deviceId = getOrCreateDeviceId();
    let displayName = localStorage.getItem('lanDisplayName') || '';

    let boardImages = [];
    let featuredId = null;
    let lightboxImageId = null;

    // ---------------- Login ----------------
    const loginOverlay = document.getElementById('loginOverlay');
    const passwordInput = document.getElementById('passwordInput');
    const loginError = document.getElementById('loginError');

    function showLogin(msg) {
      loginOverlay.style.display = 'flex';
      if (msg) loginError.textContent = msg;
      passwordInput.focus();
    }
    function hideLogin() {
      loginOverlay.style.display = 'none';
      loginError.textContent = '';
    }

        const nameInput = document.getElementById('nameInput');
    nameInput.value = displayName;

    document.getElementById('loginButton').addEventListener('click', () => {
      const pw = passwordInput.value.trim();
      const name = nameInput.value.trim() || 'My Device';
      if (!pw) return;
      authPassword = pw;
      displayName = name.slice(0, 32);
      sessionStorage.setItem('lanChatPassword', pw);
      localStorage.setItem('lanDisplayName', displayName);
      warmUpMicrophone();
      connect();
    });
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginButton').click();
    });
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') passwordInput.focus();
    });

    // ---------------- Tabs ----------------
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');
        if (tab.dataset.tab === 'board') loadBoardFromServer();
      });
    });

    // ---------------- Ringtone ----------------
    let ringtoneCtx = null;
    let ringtoneTimer = null;

    function startRingtone() {
      stopRingtone();
      try {
        ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
        const beep = () => {
          if (!ringtoneCtx) return;
          const osc = ringtoneCtx.createOscillator();
          const gain = ringtoneCtx.createGain();
          osc.connect(gain);
          gain.connect(ringtoneCtx.destination);
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.0001, ringtoneCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.15, ringtoneCtx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ringtoneCtx.currentTime + 0.5);
          osc.start(ringtoneCtx.currentTime);
          osc.stop(ringtoneCtx.currentTime + 0.55);
        };
        beep();
        ringtoneTimer = setInterval(beep, 1200);
      } catch (e) { console.log('Ringtone error:', e); }
    }
    function stopRingtone() {
      if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; }
      if (ringtoneCtx) { ringtoneCtx.close().catch(() => {}); ringtoneCtx = null; }
    }

    // ---------------- Mic warm-up ----------------
    async function warmUpMicrophone() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: true });
        s.getTracks().forEach(t => t.stop());
        console.log('Microphone permission granted.');
      } catch (e) {
        console.warn('Microphone permission denied or unavailable:', e);
      }
    }

    // ---------------- WebSocket ----------------
    function connect() {
      if (!authPassword) { showLogin(); return; }
      hideLogin();

      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

      const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      ws = new WebSocket(protocol + window.location.host + '/ws');

    ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'auth',
          password: authPassword,
          device_id: deviceId,
          display_name: displayName,
        }));
      };

      ws.onmessage = (event) => handleMessage(JSON.parse(event.data));

      ws.onclose = (event) => {
        if (event.code === 1008) {
          sessionStorage.removeItem('lanChatPassword');
          authPassword = null;
          passwordInput.value = '';
          showLogin('Wrong password. Try again.');
          return;
        }
        reconnectTimer = setTimeout(connect, 2000);
      };
    }

    function handleMessage(data) {
      const messagesDiv = document.getElementById('messages');

      switch (data.type) {
        case 'welcome':
          myId = data.id;
          myUsername = data.username;
          console.log('My ID:', myId, 'Username:', myUsername);
          loadBoardFromServer();
          break;

        case 'userlist':
          updateUserList(data.users);
          break;

        case 'chat': {
          const div = document.createElement('div');
          const outgoing = (data.username === myUsername);
          div.className = 'message ' + (outgoing ? 'outgoing' : 'incoming');
          const time = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          div.innerHTML = `<strong>${escapeHtml(data.username)}</strong><span class="time">${time}</span><br>${escapeHtml(data.text)}`;
          messagesDiv.appendChild(div);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          break;
        }

        case 'file':
          handleFileMessage(data);
          break;

        case 'system': {
          const sysDiv = document.createElement('div');
          sysDiv.className = 'system';
          sysDiv.textContent = data.text;
          messagesDiv.appendChild(sysDiv);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          break;
        }

        case 'image_added':
          boardImages.unshift(data.image);
          renderBoard();
          break;

        case 'image_featured':
          featuredId = data.featured_id;
          renderBoard();
          break;

        case 'image_deleted':
          boardImages = boardImages.filter(i => i.id !== data.image_id);
          featuredId = data.featured_id;
          renderBoard();
          if (lightboxImageId === data.image_id) closeLightbox();
          break;

        case 'file_deleted':
          document.querySelectorAll('.file-message').forEach(el => {
            if (el.dataset.url === data.url) el.remove();
          });
          if (data.image_id) {
            boardImages = boardImages.filter(i => i.id !== data.image_id);
            featuredId = data.featured_id;
            renderBoard();
            if (lightboxImageId === data.image_id) closeLightbox();
          }
          break;

        case 'call-request':    handleIncomingCall(data.from, data.fromUsername); break;
        case 'call-accept':     handleCallAccepted(data.from); break;
        case 'call-reject':     handleCallRejected(); break;
        case 'call-end':        handleCallEnded(); break;
        case 'offer':           handleOffer(data.from, data.sdp); break;
        case 'answer':          handleAnswer(data.from, data.sdp); break;
        case 'ice-candidate':   handleIceCandidate(data.from, data.candidate); break;
      }
    }

    // ---------------- Board ----------------
    async function loadBoardFromServer() {
      try {
        const resp = await fetch('/images', { cache: 'no-store' });
        if (!resp.ok) return;
        const data = await resp.json();
        boardImages = data.images || [];
        featuredId = data.featured_id;
        renderBoard();
      } catch (e) {
        console.warn('Failed to load board:', e);
      }
    }

    function renderBoard() {
      const featuredArea = document.getElementById('featuredArea');
      if (featuredId) {
        const feat = boardImages.find(i => i.id === featuredId);
        if (feat) {
          featuredArea.innerHTML = `
            <div class="featured-card">
              <span class="featured-label">★ Featured · ${escapeHtml(feat.uploader)}</span>
              <img src="${feat.url}" alt="${escapeHtml(feat.filename)}" data-id="${feat.id}" class="featured-img" />
            </div>`;
          featuredArea.querySelector('img').addEventListener('click', () => openLightbox(feat.id));
        } else {
          featuredArea.innerHTML = '';
        }
      } else {
        featuredArea.innerHTML = '';
      }

      const grid = document.getElementById('imageGrid');
      const empty = document.getElementById('emptyBoard');
      if (boardImages.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = boardImages.map(img => `
        <div class="thumb ${img.id === featuredId ? 'featured' : ''}" data-id="${img.id}">
          <img src="${img.url}" alt="${escapeHtml(img.filename)}" loading="lazy" />
          <div class="uploader-tag">${escapeHtml(img.uploader)}</div>
        </div>
      `).join('');

      grid.querySelectorAll('.thumb').forEach(el => {
        el.addEventListener('click', () => openLightbox(el.dataset.id));
      });
    }

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbInfo = document.getElementById('lbInfo');
    const lbFeatureBtn = document.getElementById('lbFeatureBtn');

    function openLightbox(id) {
      const img = boardImages.find(i => i.id === id);
      if (!img) return;
      lightboxImageId = id;
      lbImg.src = img.url;
      lbImg.alt = img.filename;
      const time = new Date(img.timestamp).toLocaleString();
      lbInfo.textContent = `${img.uploader} • ${time}`;
      lbFeatureBtn.textContent = (id === featuredId) ? 'Unfeature' : 'Set as Featured';

      const dl = document.getElementById('lbDownloadBtn');
      dl.href = '#';
      dl.dataset.url = img.url;
      dl.dataset.name = img.filename;

      lightbox.style.display = 'flex';
    }
    function closeLightbox() {
      lightbox.style.display = 'none';
      lightboxImageId = null;
      lbImg.src = '';
    }

    document.getElementById('lbDownloadBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (lightboxImageId) {
        const img = boardImages.find(i => i.id === lightboxImageId);
        if (img) downloadFile(img.url, img.filename);
      }
    });

    document.getElementById('lbCloseBtn').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.getElementById('lbDeleteBtn').addEventListener('click', async () => {
      if (!lightboxImageId || !authPassword) return;
      if (!confirm('Delete this image permanently?')) return;
      const fd = new FormData();
      fd.append('image_id', lightboxImageId);
      fd.append('password', authPassword);
      try {
        const resp = await fetch('/delete', { method: 'POST', body: fd });
        if (resp.ok) {
          closeLightbox();
        } else if (resp.status === 401) {
          alert('Wrong password.');
        } else {
          alert('Delete failed: ' + resp.status);
        }
      } catch (e) { console.error(e); }
    });

    lbFeatureBtn.addEventListener('click', async () => {
      if (!lightboxImageId || !authPassword) return;
      const fd = new FormData();
      fd.append('image_id', lightboxImageId);
      fd.append('password', authPassword);
      try {
        const resp = await fetch('/feature', { method: 'POST', body: fd });
        if (resp.ok) {
          const data = await resp.json();
          featuredId = data.featured_id;
          renderBoard();
          closeLightbox();
        } else if (resp.status === 401) {
          alert('Wrong password.');
        }
      } catch (e) { console.error(e); }
    });

    // Board upload
    document.getElementById('boardUploadBtn').addEventListener('click', async () => {
      const input = document.getElementById('boardFileInput');
      const file = input.files[0];
      if (!file) { alert('Choose an image first.'); return; }
      if (!file.type.startsWith('image/')) { alert('Only images allowed on the board.'); return; }
      if (!authPassword) { alert('Not authenticated.'); return; }

      const fd = new FormData();
      fd.append('file', file);
      fd.append('password', authPassword);
      if (myId) fd.append('user_id', myId);

      try {
        const resp = await fetch('/upload', { method: 'POST', body: fd });
        if (resp.ok) {
          input.value = '';
        } else if (resp.status === 401) {
          alert('Wrong password.');
        } else {
          alert('Upload failed: ' + resp.status);
        }
      } catch (e) { console.error(e); }
    });

    // ---------------- Chat and files ----------------
    function handleFileMessage(data) {
      const messagesDiv = document.getElementById('messages');
      const fileDiv = document.createElement('div');
      const outgoing = (data.username === myUsername);
      fileDiv.className = 'file-message ' + (outgoing ? 'outgoing' : 'incoming');
      fileDiv.dataset.url = data.url;
      const time = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const badge = data.private ? '<span class="private-badge">Private</span>' : '';
      const delBtn = `<button class="del-file-btn" data-url="${data.url}" title="Delete file from server">🗑</button>`;

      if (data.content_type && data.content_type.startsWith('image/')) {
        fileDiv.innerHTML = `<strong>${escapeHtml(data.username)}</strong><span class="time">${time}</span> ${badge} ${delBtn}<br>
          <img src="${data.url}" alt="${escapeHtml(data.filename)}" />
          <br><a class="dl-link" href="#" data-url="${data.url}" data-name="${escapeHtml(data.filename)}">⬇ Download</a>`;
      } else {
        fileDiv.innerHTML = `<strong>${escapeHtml(data.username)}</strong><span class="time">${time}</span> ${badge} ${delBtn}<br>
          📎 <a href="#" class="dl-link" data-url="${data.url}" data-name="${escapeHtml(data.filename)}">${escapeHtml(data.filename)}</a>`;
      }

      fileDiv.querySelectorAll('.dl-link').forEach(el => {
        el.addEventListener('click', (ev) => {
          ev.preventDefault();
          downloadFile(el.dataset.url, el.dataset.name);
        });
      });

      fileDiv.querySelectorAll('.del-file-btn').forEach(el => {
        el.addEventListener('click', async (ev) => {
          ev.preventDefault();
          if (!confirm('Delete this file from the server? This cannot be undone.')) return;
          if (!authPassword) return;
          const fd = new FormData();
          fd.append('url', el.dataset.url);
          fd.append('password', authPassword);
          try {
            const resp = await fetch('/delete-file', { method: 'POST', body: fd });
            if (resp.status === 401) alert('Wrong password.');
          } catch (e) { console.error(e); }
        });
      });

      messagesDiv.appendChild(fileDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUserList(users) {
      const userlistDiv = document.getElementById('userlist');
      let html = `<div class="userlist-header"><span>Online</span><span class="userlist-count">${users.length}</span></div>`;
    users.forEach(user => {
        const isMe = user.id === myId;
        html += `<div class="user-item">
          <span class="user-name">${escapeHtml(user.username)}${isMe ? ' (you)' : ''}</span>
          ${isMe
            ? `<button class="call-btn rename-btn" type="button">✎ Rename</button>`
            : `<button class="call-btn" data-id="${user.id}">📞 Call</button>`}
        </div>`;
      });
      userlistDiv.innerHTML = html;

            document.querySelectorAll('.call-btn:not(.rename-btn)').forEach(btn => {
        btn.addEventListener('click', () => startCall(btn.getAttribute('data-id')));
      });
      document.querySelectorAll('.rename-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const next = prompt('New display name:', displayName);
          if (!next) return;
          const trimmed = next.trim().slice(0, 32);
          if (!trimmed) return;
          displayName = trimmed;
          localStorage.setItem('lanDisplayName', displayName);
          // Reconnect to apply the new name
          if (ws) {
            try { ws.close(); } catch (e) {}
          }
        });
      });

      const sel = document.getElementById('targetSelect');
      const prev = sel.value;
      sel.innerHTML = '<option value="">Everyone</option>';
      users.forEach(user => {
        if (user.id === myId) return;
        const opt = document.createElement('option');
        opt.value = user.id;
        opt.textContent = user.username;
        sel.appendChild(opt);
      });
      if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'chat', text }));
        input.value = '';
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) { alert('Please select a file first.'); return; }
      if (!authPassword) { alert('Not authenticated.'); return; }

      const targetId = document.getElementById('targetSelect').value;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('password', authPassword);
      if (myId) formData.append('user_id', myId);
      if (targetId) formData.append('target_id', targetId);

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        if (response.ok) {
          fileInput.value = '';
        } else if (response.status === 401) {
          alert('Upload rejected: wrong password.');
        }
      } catch (err) { console.error('Upload error:', err); }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function downloadFile(url, filename) {
      try {
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'download';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
      } catch (e) {
        alert('Download failed: ' + e.message);
      }
    }

    // ---------------- WebRTC ----------------
    let localStream = null;
    let peerConnection = null;
    let currentCallPartnerId = null;
    let isMuted = false;
    let isInCall = false;

    async function startCall(targetId) {
      if (isInCall) { alert('You are already in a call. Hang up first.'); return; }
      currentCallPartnerId = targetId;
      ws.send(JSON.stringify({ type: 'call-request', target: targetId }));
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert('Microphone access denied or not available.');
        ws.send(JSON.stringify({ type: 'call-end', target: targetId }));
        currentCallPartnerId = null;
        return;
      }
      showCallStatus('Calling...');
    }

    function handleIncomingCall(fromId, fromUsername) {
      if (isInCall) {
        ws.send(JSON.stringify({ type: 'call-reject', target: fromId }));
        return;
      }
      currentCallPartnerId = fromId;
      document.getElementById('incomingCallUser').textContent = fromUsername;
      document.getElementById('incomingCall').style.display = 'block';
      startRingtone();
    }

        document.getElementById('acceptCallBtn').addEventListener('click', async () => {
      stopRingtone();
      document.getElementById('incomingCall').style.display = 'none';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert('Microphone access denied or not available.');
        ws.send(JSON.stringify({ type: 'call-reject', target: currentCallPartnerId }));
        currentCallPartnerId = null;
        return;
      }
      // Send accept — we do NOT create the offer. The caller will.
      ws.send(JSON.stringify({ type: 'call-accept', target: currentCallPartnerId }));
      showCallStatus('Connecting...');
      isInCall = true;
      // Do NOT create the peer connection here. It's created in handleOffer,
      // which arrives from the caller right after this.
    });

    document.getElementById('rejectCallBtn').addEventListener('click', () => {
      stopRingtone();
      document.getElementById('incomingCall').style.display = 'none';
      ws.send(JSON.stringify({ type: 'call-reject', target: currentCallPartnerId }));
      currentCallPartnerId = null;
    });

    function handleCallAccepted(fromId) {
      if (currentCallPartnerId !== fromId) return;
      createPeerConnection().then(async () => {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: 'offer', target: fromId, sdp: offer }));
        showCallStatus(`In call with ${fromId}`);
        isInCall = true;
      });
    }

    function handleCallRejected() { alert('Call rejected by the other user.'); cleanupCall(); hideCallStatus(); }
    function handleCallEnded()    { alert('Call ended by the other user.');   cleanupCall(); hideCallStatus(); }

    function hangup() {
      if (currentCallPartnerId) ws.send(JSON.stringify({ type: 'call-end', target: currentCallPartnerId }));
      cleanupCall();
      hideCallStatus();
    }

    function cleanupCall() {
      stopRingtone();
      if (peerConnection) {
        peerConnection.onicecandidate = null;
        peerConnection.ontrack = null;
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      const remoteAudio = document.getElementById('remoteAudio');
      if (remoteAudio) remoteAudio.srcObject = null;
      currentCallPartnerId = null;
      isInCall = false;
      isMuted = false;
      document.getElementById('muteBtn').textContent = 'Mute';
    }

    function showCallStatus(text) {
      document.getElementById('callStatusText').textContent = text;
      document.getElementById('callStatus').style.display = 'block';
    }
    function hideCallStatus() { document.getElementById('callStatus').style.display = 'none'; }

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remoteAudio');
        remoteAudio.srcObject = event.streams[0];
        remoteAudio.play().catch(e => console.log('Playback error:', e));
      };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            target: currentCallPartnerId,
            candidate: event.candidate
          }));
        }
      };
      peerConnection.onconnectionstatechange = () => console.log('Connection state:', peerConnection.connectionState);
      peerConnection.oniceconnectionstatechange = () => console.log('ICE state:', peerConnection.iceConnectionState);
      return peerConnection;
    }

        async function handleOffer(fromId, sdp) {
      if (currentCallPartnerId !== fromId) return;
      // If a connection already exists (shouldn't, but be defensive), close it first
      if (peerConnection) {
        try { peerConnection.close(); } catch (e) {}
        peerConnection = null;
      }
      await createPeerConnection();
      await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', target: fromId, sdp: answer }));
      showCallStatus(`In call with ${fromId}`);
      isInCall = true;
    }

    async function handleAnswer(fromId, sdp) {
      if (currentCallPartnerId !== fromId) return;
      await peerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
    }

    function handleIceCandidate(fromId, candidate) {
      if (currentCallPartnerId !== fromId || !peerConnection) return;
      peerConnection.addIceCandidate(new RTCIceCandidate(candidate))
        .catch(e => console.log('Error adding ICE:', e));
    }

    document.getElementById('muteBtn').addEventListener('click', () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
      document.getElementById('muteBtn').textContent = isMuted ? 'Unmute' : 'Mute';
    });

    document.getElementById('hangupBtn').addEventListener('click', hangup);
    document.getElementById('sendButton').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('uploadButton').addEventListener('click', uploadFile);

    // ---------------- Start ----------------
    if (authPassword) {
      warmUpMicrophone();
      connect();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
